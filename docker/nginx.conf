server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The browser sees exactly one LAN origin; internal API ports stay private.
    # Keep proxy buffering off so Socket.IO long polling / audio work correctly.
    location /v1/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
        client_max_body_size 12m;
    }
    location /socket.io/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    # A missing private SDK Core/shader file is a 404, never the SPA HTML.
    location ~ ^/(live2d/core|cubism5/shaders)/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
