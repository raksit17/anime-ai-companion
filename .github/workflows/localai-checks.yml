name: LocalAI multimodal checks

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/contracts/**"
      - "package*.json"
      - ".github/workflows/localai-checks.yml"
  push:
    branches:
      - feat/localai-multimodal-companion

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run generate
      - run: npm run build
      - run: npm test
